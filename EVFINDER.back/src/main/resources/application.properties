# Conexão com o PostgreSQL do Docker (docker-compose.yml)
# DB_PORT é opcional: use no .env se a porta 5432 já estiver ocupada na sua máquina
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/evfinder_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Cria e atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chave da API do Open Charge Map: nunca coloque o valor aqui.
# Defina a variável de ambiente OCM_API_KEY ou crie o arquivo .env (veja .env.example).
spring.config.import=optional:file:.env[.properties]
openchargemap.api-key=${OCM_API_KEY}

# Regras do check-in de recompensas
rewards.tokens-per-check-in=5
# A mesma carteira só pontua de novo na mesma estação depois deste intervalo
rewards.check-in-cooldown=24h
# O usuário precisa estar a no máximo esta distância (em metros) da estação
rewards.max-check-in-distance-meters=200