# Conexão com o PostgreSQL do Docker
spring.datasource.url=jdbc:postgresql://localhost:5432/evfinder_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Cria e atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chave da API do Open Charge Map: nunca coloque o valor aqui.
# Defina a variável de ambiente OCM_API_KEY ou crie o arquivo .env (veja .env.example).
spring.config.import=optional:file:.env[.properties]
openchargemap.api-key=${OCM_API_KEY}